name: Build Automation Cloud APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android 35
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Descompactar projeto
        run: |
          mkdir projeto
          unzip -q automation-cloud-android-native.zip -d projeto
          ls -la projeto/automation-cloud-android-native

      - name: Compilar APK
        working-directory: projeto/automation-cloud-android-native
        run: gradle :app:assembleDebug --stacktrace

      - name: Preparar APK
        run: |
          cp projeto/automation-cloud-android-native/app/build/outputs/apk/debug/app-debug.apk AutomationCloud.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: AutomationCloud-APK
          path: AutomationCloud.apk
          retention-days: 30
